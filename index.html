<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uniform Tracker — Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid #e5e5e0;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.topbar h2{font-size:16px;font-weight:600}
.topbar p{font-size:12px;color:#888;margin-top:2px}
.live-dot{display:inline-block;width:8px;height:8px;background:#22c55e;border-radius:50%;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.refresh-btn{background:none;border:1px solid #e5e5e0;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.add-btn{background:#1a1a1a;color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;margin-left:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 20px}
.stat{background:#fff;border-radius:10px;padding:14px;text-align:center}
.stat-num{font-size:24px;font-weight:700}
.stat-label{font-size:11px;color:#888;margin-top:2px}
.school-tabs{display:flex;gap:8px;padding:0 20px 12px;overflow-x:auto;scrollbar-width:none}
.school-tabs::-webkit-scrollbar{display:none}
.stab{background:#fff;border:1px solid #e5e5e0;border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.stab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.school-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:0 20px 20px}
.school-card{background:#fff;border-radius:12px;padding:16px;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.school-card.selected{border-color:#1a1a1a}
.school-card h3{font-size:15px;font-weight:600;margin-bottom:4px}
.school-card .meta{font-size:12px;color:#888;margin-bottom:10px}
.progress-bar{height:6px;background:#f0f0e8;border-radius:3px;overflow:hidden;margin-bottom:6px}
.progress-fill{height:100%;background:#22c55e;border-radius:3px;transition:width .3s}
.school-stats{display:flex;gap:12px;font-size:12px;color:#555}
.detail-panel{background:#fff;margin:0 20px 20px;border-radius:12px;padding:16px}
.detail-panel h3{font-size:16px;font-weight:600;margin-bottom:12px}
.student-search{width:100%;padding:8px 12px;border:1px solid #e5e5e0;border-radius:8px;font-size:14px;margin-bottom:12px}
.student-list{max-height:300px;overflow-y:auto}
.student-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0e8;font-size:13px}
.student-row:last-child{border-bottom:none}
.student-row .badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#f0f0e8}
.student-row .badge.boy{background:#dbeafe;color:#1d4ed8}
.student-row .badge.girl{background:#fce7f3;color:#9d174d}
.log-list{margin-top:12px}
.log-entry{font-size:13px;padding:8px 10px;border-radius:8px;background:#f8f8f4;margin-bottom:6px;display:flex;gap:8px;align-items:flex-start}
.log-entry .dir{font-size:11px;padding:2px 8px;border-radius:10px;flex-shrink:0}
.dir.out{background:#dcfce7;color:#166534}
.dir.in{background:#fee2e2;color:#991b1b}
.loading{text-align:center;padding:40px;color:#888;font-size:14px}
.name-banner{background:#f0fdf4;border-bottom:1px solid #dcfce7;padding:8px 20px;font-size:13px;display:flex;align-items:center;gap:8px}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:17px;font-weight:600;margin-bottom:16px}
.modal label{display:block;font-size:13px;color:#555;margin-bottom:4px;margin-top:12px}
.modal input,.modal select,.modal textarea{width:100%;padding:9px 12px;border:1px solid #e5e5e0;border-radius:8px;font-size:14px}
.modal textarea{height:70px;resize:vertical}
.modal .actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.btn-cancel{background:none;border:1px solid #e5e5e0;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px}
.btn-submit{background:#1a1a1a;color:#fff;border:none;border-radius:8px;padding:8px 20px;cursor:pointer;font-size:14px}
.student-autocomplete{position:relative}
.autocomplete-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #e5e5e0;border-radius:8px;max-height:200px;overflow-y:auto;z-index:300;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.autocomplete-item{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f0f0e8}
.autocomplete-item:hover{background:#f8f8f4}
.autocomplete-item:last-child{border-bottom:none}
</style>
</head>
<body>

<!-- ── CONFIG — replace these two values ── -->
<script>
const SHEET_ID     = '1EFjr4jxg4pr5FUp-O0p2SoEHv0jZEAMYuOQYVQtwx0s';       // from the Google Sheet URL
const API_KEY      = 'AIzaSyBcjDdYjBjVXHTbvyRey9rR80wVQbgEoHs'; // from Google Cloud Console
const SHEETS = {
  SCHOOLS:    'Schools',
  DISPATCHES: 'Dispatches',
  STUDENTS:   'Students',
};
</script>

<div class="topbar">
  <div>
    <h2><span class="live-dot"></span>Uniform distribution tracker</h2>
    <p id="last-updated">Loading…</p>
  </div>
  <div>
    <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
    <button class="add-btn" onclick="showLogModal()">+ Log dispatch</button>
  </div>
</div>
<div class="name-banner" id="name-banner" style="display:none"></div>
<div id="top-stats" class="stats"></div>
<div id="school-tabs" class="school-tabs"></div>
<div id="school-grid" class="school-grid"><div class="loading">Loading schools…</div></div>
<div id="detail-panel"></div>

<!-- Log modal -->
<div class="modal-bg" id="log-modal">
  <div class="modal">
    <h3>Log dispatch / return</h3>
    <label>School</label>
    <select id="m-school"></select>
    <label>Student name</label>
    <div class="student-autocomplete">
      <input type="text" id="m-student" placeholder="Type to search student…" autocomplete="off" oninput="filterStudents()">
      <div class="autocomplete-list" id="autocomplete-list" style="display:none"></div>
    </div>
    <label>Item</label>
    <select id="m-item">
      <option>Uniform top</option>
      <option>Uniform bottom</option>
      <option>Shoes</option>
      <option>Socks</option>
      <option>Full set</option>
    </select>
    <label>Direction</label>
    <select id="m-dir">
      <option value="Out">Out — dispatching to student</option>
      <option value="In">In — returning / collecting back</option>
    </select>
    <label>Size</label>
    <input type="text" id="m-size" placeholder="e.g. 28/10, Medium, 33/1">
    <label>Quantity</label>
    <input type="number" id="m-qty" value="1" min="1">
    <label>Condition</label>
    <select id="m-cond">
      <option>New</option>
      <option>Good</option>
      <option>Fair</option>
      <option>Damaged</option>
    </select>
    <label>Notes (optional)</label>
    <textarea id="m-notes" placeholder="Any additional notes…"></textarea>
    <div class="actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-submit" onclick="submitLog()">Save entry</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──
let allSchools = [];
let allDispatches = [];
let allStudents = [];
let activeSchool = 'all';
let myName = localStorage.getItem('loggerName') || '';

// ── GOOGLE SHEETS FETCH ──
async function fetchSheet(sheetName) {
  const range = encodeURIComponent(sheetName);
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?key=${API_KEY}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!data.values || data.values.length < 2) return [];
  const headers = data.values[0];
  return data.values.slice(1).map(row => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = row[i] || '');
    return obj;
  });
}

async function appendRow(sheetName, rowData) {
  // Requires OAuth — use a Google Apps Script Web App as proxy
  const url = `https://script.google.com/macros/s/${GAS_DEPLOY_ID}/exec`;
  await fetch(url, {
    method: 'POST',
    body: JSON.stringify({ sheet: sheetName, row: rowData }),
  });
}

// ── LOAD ALL DATA ──
async function loadAll() {
  try {
    document.getElementById('last-updated').textContent = 'Refreshing…';
    [allSchools, allDispatches, allStudents] = await Promise.all([
      fetchSheet(SHEETS.SCHOOLS),
      fetchSheet(SHEETS.DISPATCHES),
      fetchSheet(SHEETS.STUDENTS),
    ]);
    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    renderAll();
    if (!myName) askName();
  } catch(e) {
    document.getElementById('school-grid').innerHTML = `<div class="loading" style="color:#d04030">Error loading data: ${e.message}<br><button onclick="loadAll()">Try again</button></div>`;
  }
}

function getSchoolDispatches(schoolName) {
  return allDispatches.filter(r => r['School'] === schoolName);
}

function renderAll() {
  renderTopStats();
  renderTabs();
  renderSchoolGrid();
}

function renderTopStats() {
  const total = allDispatches.length;
  const dispatched = allDispatches.filter(r => r['Direction'] === 'Out').reduce((a, r) => a + (parseInt(r['Quantity']) || 0), 0);
  const returned = allDispatches.filter(r => r['Direction'] === 'In').reduce((a, r) => a + (parseInt(r['Quantity']) || 0), 0);
  document.getElementById('top-stats').innerHTML = `
    <div class="stat"><div class="stat-num">${allSchools.length}</div><div class="stat-label">Schools</div></div>
    <div class="stat"><div class="stat-num">${allStudents.length.toLocaleString()}</div><div class="stat-label">Students</div></div>
    <div class="stat"><div class="stat-num" style="color:#166534">${dispatched - returned}</div><div class="stat-label">Items out (net)</div></div>
    <div class="stat"><div class="stat-num" style="color:#991b1b">${returned}</div><div class="stat-label">Returned</div></div>
  `;
}

function renderTabs() {
  const tabs = [{ id: 'all', name: 'All schools' }, ...allSchools.map(s => ({ id: s['Name'], name: s['Name'] }))];
  document.getElementById('school-tabs').innerHTML = tabs.map(t =>
    `<button class="stab${activeSchool === t.id ? ' active' : ''}" onclick="setTab('${t.id}')">${t.name}</button>`
  ).join('');
}

function setTab(id) {
  activeSchool = id;
  renderTabs();
  renderSchoolGrid();
  document.getElementById('detail-panel').innerHTML = '';
}

function renderSchoolGrid() {
  const schools = activeSchool === 'all' ? allSchools : allSchools.filter(s => s['Name'] === activeSchool);
  if (!schools.length) { document.getElementById('school-grid').innerHTML = '<div class="loading">No schools found</div>'; return; }
  document.getElementById('school-grid').innerHTML = schools.map(s => {
    const recs = getSchoolDispatches(s['Name']);
    const out = recs.filter(r => r['Direction'] === 'Out').reduce((a, r) => a + (parseInt(r['Quantity']) || 0), 0);
    const studentCount = allStudents.filter(st => st['School'] === s['Name']).length;
    const allocated = parseInt(s['Allocated']) || studentCount || 1;
    const pct = Math.min(100, Math.round(out / allocated * 100));
    return `
    <div class="school-card${activeSchool === s['Name'] ? ' selected' : ''}" onclick="showDetail('${s['Name']}')">
      <h3>${s['Name']}</h3>
      <div class="meta">${s['Location'] || ''} · ${studentCount} students</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="school-stats">
        <span>${out} dispatched</span>
        <span>${pct}% coverage</span>
        <span>${recs.length} log entries</span>
      </div>
    </div>`;
  }).join('');
}

function showDetail(schoolName) {
  activeSchool = schoolName;
  renderTabs();
  renderSchoolGrid();
  const students = allStudents.filter(s => s['School'] === schoolName);
  const logs = getSchoolDispatches(schoolName).slice(-20).reverse();
  document.getElementById('detail-panel').innerHTML = `
    <div class="detail-panel">
      <h3>${schoolName} — Students (${students.length})</h3>
      <input class="student-search" placeholder="Search student…" oninput="filterDetailStudents(this.value, '${schoolName}')">
      <div class="student-list" id="student-list-detail">
        ${renderStudentRows(students)}
      </div>
      <h3 style="margin-top:20px">Recent dispatches</h3>
      <div class="log-list">
        ${logs.length ? logs.map(l => `
          <div class="log-entry">
            <span class="dir ${l['Direction'] === 'Out' ? 'out' : 'in'}">${l['Direction']}</span>
            <div>
              <strong>${l['Student'] || l['Child Name'] || '—'}</strong> · ${l['Item'] || ''} ${l['Size'] || ''}<br>
              <span style="color:#888;font-size:12px">${l['Logged By'] || ''} · ${l['Timestamp'] || ''}</span>
            </div>
          </div>`).join('') : '<div style="color:#888;font-size:13px;padding:8px 0">No dispatches logged yet</div>'}
      </div>
    </div>`;
}

function renderStudentRows(students) {
  if (!students.length) return '<div style="color:#888;font-size:13px;padding:8px 0">No students found</div>';
  return students.map(s => `
    <div class="student-row">
      <span>${s['Name']}</span>
      <div style="display:flex;gap:6px;align-items:center">
        <span style="color:#888;font-size:12px">${s['Class'] || ''}</span>
        <span class="badge ${s['Gender'] === 'Boy' ? 'boy' : 'girl'}">${s['Gender']}</span>
        <span style="font-size:12px;color:#888">${s['Shoe Size'] || ''}</span>
      </div>
    </div>`).join('');
}

function filterDetailStudents(q, schoolName) {
  const students = allStudents.filter(s => s['School'] === schoolName && s['Name'].toLowerCase().includes(q.toLowerCase()));
  document.getElementById('student-list-detail').innerHTML = renderStudentRows(students);
}

// ── LOG MODAL ──
function showLogModal() {
  const sel = document.getElementById('m-school');
  sel.innerHTML = allSchools.map(s => `<option>${s['Name']}</option>`).join('');
  if (activeSchool !== 'all') sel.value = activeSchool;
  document.getElementById('log-modal').classList.add('open');
}
function closeModal() {
  document.getElementById('log-modal').classList.remove('open');
  document.getElementById('autocomplete-list').style.display = 'none';
}

function filterStudents() {
  const q = document.getElementById('m-student').value.toLowerCase();
  const school = document.getElementById('m-school').value;
  if (q.length < 2) { document.getElementById('autocomplete-list').style.display = 'none'; return; }
  const matches = allStudents
    .filter(s => s['School'] === school && s['Name'].toLowerCase().includes(q))
    .slice(0, 10);
  const list = document.getElementById('autocomplete-list');
  if (!matches.length) { list.style.display = 'none'; return; }
  list.innerHTML = matches.map(s =>
    `<div class="autocomplete-item" onclick="selectStudent('${s['Name']}','${s['Shoe Size']}','${s['Uniform Size']}')">${s['Name']} <span style="color:#888;font-size:11px">${s['Class']} · ${s['Gender']}</span></div>`
  ).join('');
  list.style.display = 'block';
}

function selectStudent(name, shoe, uniform) {
  document.getElementById('m-student').value = name;
  document.getElementById('m-size').value = uniform || shoe || '';
  document.getElementById('autocomplete-list').style.display = 'none';
}

async function submitLog() {
  const row = {
    School:     document.getElementById('m-school').value,
    Student:    document.getElementById('m-student').value,
    Item:       document.getElementById('m-item').value,
    Direction:  document.getElementById('m-dir').value,
    Size:       document.getElementById('m-size').value,
    Quantity:   document.getElementById('m-qty').value,
    Condition:  document.getElementById('m-cond').value,
    Notes:      document.getElementById('m-notes').value,
    'Logged By': myName || 'Dashboard',
    Timestamp:  new Date().toISOString(),
  };
  try {
    await appendRow(SHEETS.DISPATCHES, row);
    closeModal();
    await loadAll();
  } catch(e) {
    alert('Error saving: ' + e.message);
  }
}

// ── NAME ──
function askName() {
  const n = prompt('Your name (shown in log entries):');
  if (n) { myName = n; localStorage.setItem('loggerName', n); showNameBanner(); }
}
function showNameBanner() {
  if (!myName) return;
  const b = document.getElementById('name-banner');
  b.style.display = 'flex';
  b.innerHTML = `Logged in as <strong>${myName}</strong> <button onclick="askName()" style="font-size:12px;background:none;border:none;color:#888;cursor:pointer;margin-left:8px">Change</button>`;
}

// ── INIT ──
showNameBanner();
loadAll();
</script>
</body>
</html>
